syntax = "proto3";

package dragongem.trace;

message CanonicalBB {
  string function_name = 1; // Unique for module.
  string basic_block_name = 2; // Unique for function.
  uint64 id = 3;
  uint64 inst_start_id = 4;
  uint64 bb_size = 5;

  optional uint64 loop_id = 10;
  // optional uint64 function_id = 11;
}

